plugins {
    id 'com.android.application'
}

def nativeBin = rootProject.file('../exploit/build/m3q-BP4A.251205.006/bin')
def ksudBin = rootProject.file('prebuilt/ksud-m3q-S948BXXS4AZG5-kdp')
def jniOut = file('src/main/jniLibs/arm64-v8a')

tasks.register('prepareM3qPayloads', Copy) {
    from(new File(nativeBin, 'su_daemon_aarch64_pie.app')) {
        rename { 'libm3qroot.so' }
    }
    from(new File(nativeBin, 'preload.app.so')) {
        rename { 'libm3qpayload.so' }
    }
    from(new File(nativeBin, 'slide_oracle.app.so')) {
        rename { 'libm3qoracle.so' }
    }
    from(ksudBin) {
        rename { 'libm3qksud.so' }
    }
    into(jniOut)
}

tasks.register('verifyM3qPayloads') {
    dependsOn(tasks.named('prepareM3qPayloads'))

    doLast {
        def required = [
            'libm3qroot.so',
            'libm3qpayload.so',
            'libm3qoracle.so',
            'libm3qksud.so'
        ]
        def missing = required.findAll { name ->
            !new File(jniOut, name).isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Missing native payloads: ' + missing.join(', '))
        }
    }
}

android {
    namespace = 'dev.indevelopment.m3qroot'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId 'dev.indevelopment.m3qroot.hardened'
        minSdk 36
        targetSdk 36
        versionCode 15
        versionName '0.5.7'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }

    lint {
        disable 'ChromeOsAbiSupport', 'ObsoleteSdkInt'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

tasks.named('preBuild') {
    dependsOn(tasks.named('verifyM3qPayloads'))
}
