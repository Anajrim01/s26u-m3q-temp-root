name: Build and release M3Q Root

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Build native root payloads
        working-directory: android
        run: |
          chmod +x build-native.sh test-safety-policy.sh gradlew
          ./build-native.sh

      - name: Run safety tests
        working-directory: android
        run: ./test-safety-policy.sh

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease

      - name: Verify and stage release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          for library in \
            libm3qroot.so \
            libm3qpayload.so \
            libm3qoracle.so \
            libm3qksud.so
          do
            unzip -Z1 "$apk" \
              | grep -Fx "lib/arm64-v8a/$library" >/dev/null
          done

          mkdir -p dist
          release_apk="dist/M3Q-Root-${RELEASE_TAG}.apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > dist/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          release_apk="dist/M3Q-Root-${RELEASE_TAG}.apk"
          notes="M3Q Root APK for the exact SM-S948B AZG5 target. The temporary root payload and KernelSU 3.3.0 helper are bundled in the APK; no separate root download is required. Verify SHA256SUMS before installing."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$release_apk" \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$release_apk" \
              dist/SHA256SUMS \
              --verify-tag \
              --title "M3Q Root $RELEASE_TAG" \
              --notes "$notes" \
              --generate-notes
          fi
